<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Tracking Objek 3D Fizik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Modul Three.js & Cannon-es -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
    
    <!-- MediaPipe untuk Penjejakan Tangan -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <!-- MediaPipe Drawing Utils untuk Lukis Rangka Tangan -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Gaya Kursor Tangan & Kamera */
        #hand-cursor {
            position: absolute;
            width: 24px;
            height: 24px;
            background: rgba(56, 189, 248, 0.8);
            border: 2px solid white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            transform: translate(-50%, -50%);
            transition: transform 0.1s, background-color 0.15s;
            display: none;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        .pinching {
            background: rgba(239, 68, 68, 0.9) !important;
            transform: translate(-50%, -50%) scale(0.7) !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.8) !important;
        }

        #webcam-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 220px;
            height: 165px;
            z-index: 10;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transform: scaleX(-1); /* Terbalikkan paparan kontena (mirror) */
        }

        #webcam-preview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
        }

        #webcam-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 11;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    
    <!-- Kursor Tangan & Preview Video + Canvas Rangka -->
    <div id="hand-cursor"></div>
    <div id="webcam-container">
        <video id="webcam-preview" autoplay playsinline></video>
        <canvas id="webcam-canvas" width="640" height="480"></canvas>
    </div>

    <!-- UI Panel -->
    <div id="ui-layer" class="glass-panel text-white p-4 md:p-6 rounded-2xl w-[90%] max-w-md pointer-events-none">
        <h1 class="text-xl md:text-2xl font-bold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
            AR/3D Object Tracking
        </h1>
        <p class="text-sm md:text-base text-gray-300">
            🖱️ <b>Klik/Picit Jari</b> untuk angkat objek.<br>
            ✋ Gerakkan <b>Tangan ke Kamera</b> untuk kawal.<br>
            🎥 Kamera akan <b>menjejak</b> objek secara automatik.
        </p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import * as CANNON from 'cannon-es';

        // ==========================================
        // 1. TETAPAN THREE.JS (GRAFIK)
        // ==========================================
        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 10, 50);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 8, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Pencahayaan
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // ==========================================
        // 2. TETAPAN CANNON-ES (FIZIK)
        // ==========================================
        const world = new CANNON.World({
            gravity: new CANNON.Vec3(0, -9.82, 0)
        });

        // Material Fizik
        const defaultMaterial = new CANNON.Material('default');
        const defaultContactMaterial = new CANNON.ContactMaterial(defaultMaterial, defaultMaterial, {
            friction: 0.3,
            restitution: 0.6 // Kadar lantunan
        });
        world.addContactMaterial(defaultContactMaterial);

        // Lantai Fizik
        const floorShape = new CANNON.Plane();
        const floorBody = new CANNON.Body({ mass: 0, material: defaultMaterial });
        floorBody.addShape(floorShape);
        floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        world.addBody(floorBody);

        // Lantai Visual
        const floorMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(50, 50),
            new THREE.MeshStandardMaterial({ 
                color: 0x22223b, 
                roughness: 0.8,
                metalness: 0.2
            })
        );
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        // Grid Panduan
        const gridHelper = new THREE.GridHelper(50, 50, 0x000000, 0x000000);
        gridHelper.material.opacity = 0.2;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        // ==========================================
        // 3. PENCIPTAAN OBJEK
        // ==========================================
        const objectsToUpdate = [];
        const boxGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
        const sphereGeo = new THREE.SphereGeometry(0.7, 32, 32);
        const colors = [0xe74c3c, 0x3498db, 0x2ecc71, 0xf1c40f, 0x9b59b6];

        for (let i = 0; i < 6; i++) {
            const isBox = Math.random() > 0.5;
            const mesh = new THREE.Mesh(
                isBox ? boxGeo : sphereGeo,
                new THREE.MeshStandardMaterial({ 
                    color: colors[i % colors.length],
                    roughness: 0.4,
                    metalness: 0.1
                })
            );
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            const shape = isBox ? new CANNON.Box(new CANNON.Vec3(0.6, 0.6, 0.6)) : new CANNON.Sphere(0.7);
            const body = new CANNON.Body({
                mass: 1.5,
                position: new CANNON.Vec3((Math.random() - 0.5) * 6, 5 + i * 2, (Math.random() - 0.5) * 6),
                material: defaultMaterial
            });
            body.addShape(shape);

            scene.add(mesh);
            world.addBody(body);
            mesh.userData.body = body; 
            
            objectsToUpdate.push({ mesh, body });
        }

        // ==========================================
        // 4. INTERAKSI MENGANGKAT OBJEK & KAMERA
        // ==========================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        const jointBody = new CANNON.Body({ mass: 0 });
        jointBody.collisionFilterGroup = 0;
        jointBody.collisionFilterMask = 0;
        world.addBody(jointBody);
        
        let mouseConstraint = null;
        let isDragging = false;
        let draggedMesh = null;
        let dragPlane = new THREE.Plane();
        
        const targetCameraPos = new THREE.Vector3();
        const targetControlsTarget = new THREE.Vector3();

        function startDrag() {
            raycaster.setFromCamera(mouse, camera);
            const meshes = objectsToUpdate.map(obj => obj.mesh);
            const intersects = raycaster.intersectObjects(meshes);

            if (intersects.length > 0) {
                controls.enabled = false;
                isDragging = true;
                draggedMesh = intersects[0].object;
                
                const hitPoint = intersects[0].point;
                const physicsBody = draggedMesh.userData.body;

                jointBody.position.copy(hitPoint);

                mouseConstraint = new CANNON.PointToPointConstraint(
                    physicsBody,
                    physicsBody.pointToLocalFrame(new CANNON.Vec3().copy(hitPoint)),
                    jointBody,
                    new CANNON.Vec3(0, 0, 0)
                );
                world.addConstraint(mouseConstraint);

                const cameraNormal = new THREE.Vector3().copy(camera.position).sub(hitPoint).normalize();
                dragPlane.setFromNormalAndCoplanarPoint(cameraNormal, hitPoint);
                
                draggedMesh.material.emissive = new THREE.Color(0x333333);
            }
        }

        function moveDrag() {
            if (!isDragging || !mouseConstraint) return;
            raycaster.setFromCamera(mouse, camera);
            const targetPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(dragPlane, targetPoint);
            
            if (targetPoint) {
                jointBody.position.copy(targetPoint);
            }
        }

        function endDrag() {
            if (isDragging && mouseConstraint) {
                world.removeConstraint(mouseConstraint);
                mouseConstraint = null;
                if(draggedMesh) draggedMesh.material.emissive.setHex(0x000000);
            }
            controls.enabled = true;
            isDragging = false;
            draggedMesh = null;
        }

        // Interaksi Tetikus/Sentuh
        window.addEventListener('pointerdown', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            startDrag();
        });

        window.addEventListener('pointermove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            if(isDragging) moveDrag();
        });

        window.addEventListener('pointerup', endDrag);

        // Responsif untuk skrin diubah saiz
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================
        // 5. MEDIAPIPE HANDS (PENJEJAKAN TANGAN & AKURASI)
        // ==========================================
        const videoElement = document.getElementById('webcam-preview');
        const canvasElement = document.getElementById('webcam-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const handCursor = document.getElementById('hand-cursor');
        
        let isHandPinching = false;
        let smoothMouseX = window.innerWidth / 2;
        let smoothMouseY = window.innerHeight / 2;
        let hoveredMesh = null; // Untuk highlight objek bila tepat (Hover)

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults((results) => {
            // Bersihkan kanvas lukisan
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handCursor.style.display = 'block';
                const landmarks = results.multiHandLandmarks[0];
                
                // LUKIS STYLE DI JARI DAN TANGAN
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00e5ff', lineWidth: 3});
                drawLandmarks(canvasCtx, landmarks, {color: '#ff1744', lineWidth: 1, radius: 4});
                
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                
                const dx = thumbTip.x - indexTip.x;
                const dy = thumbTip.y - indexTip.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                // Terbalikkan kursor (mirror) untuk posisi sasaran maya
                const targetCursorX = (1 - ((thumbTip.x + indexTip.x) / 2)) * window.innerWidth;
                const targetCursorY = ((thumbTip.y + indexTip.y) / 2) * window.innerHeight;
                
                // PENINGKATAN AKURASI: Smoothing kursor untuk kurangkan gegaran
                smoothMouseX += (targetCursorX - smoothMouseX) * 0.35;
                smoothMouseY += (targetCursorY - smoothMouseY) * 0.35;

                handCursor.style.left = `${smoothMouseX}px`;
                handCursor.style.top = `${smoothMouseY}px`;
                
                // Set koordinat maya untuk simulasi tetikus
                mouse.x = (smoothMouseX / window.innerWidth) * 2 - 1;
                mouse.y = -(smoothMouseY / window.innerHeight) * 2 + 1;
                
                // PENINGKATAN AKURASI: Kesan Highlight/Glow Objek bila dihala tepat
                if (!isDragging) {
                    raycaster.setFromCamera(mouse, camera);
                    const meshes = objectsToUpdate.map(obj => obj.mesh);
                    const intersects = raycaster.intersectObjects(meshes);
                    
                    if (intersects.length > 0) {
                        if (hoveredMesh !== intersects[0].object) {
                            if (hoveredMesh) hoveredMesh.material.emissive.setHex(0x000000);
                            hoveredMesh = intersects[0].object;
                            hoveredMesh.material.emissive.setHex(0x444444); // Objek menyala sikit (bersedia diangkat)
                        }
                    } else {
                        if (hoveredMesh) {
                            hoveredMesh.material.emissive.setHex(0x000000);
                            hoveredMesh = null;
                        }
                    }
                }

                // Radius pinch dibesarkan sedikit agar mudah diangkat
                const pinchThreshold = 0.08;

                if (distance < pinchThreshold && !isHandPinching) {
                    isHandPinching = true;
                    handCursor.classList.add('pinching');
                    startDrag();
                } else if (distance < pinchThreshold && isHandPinching) {
                    moveDrag();
                } else if (distance > pinchThreshold && isHandPinching) {
                    isHandPinching = false;
                    handCursor.classList.remove('pinching');
                    endDrag();
                }
            } else {
                handCursor.style.display = 'none';
                if(isHandPinching) {
                    isHandPinching = false;
                    handCursor.classList.remove('pinching');
                    endDrag();
                }
                if (hoveredMesh) {
                    hoveredMesh.material.emissive.setHex(0x000000);
                    hoveredMesh = null;
                }
            }
            canvasCtx.restore();
        });

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 640,
                height: 480
            });
            cameraUtils.start().catch(err => console.error("Kamera gagal:", err));
        }

        // ==========================================
        // 6. ANIMASI & RENDER LOOP
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const deltaTime = Math.min(clock.getDelta(), 0.1);
            world.step(1/60, deltaTime, 3);

            // Selaraskan fizik dengan grafik 3D
            for (const obj of objectsToUpdate) {
                obj.mesh.position.copy(obj.body.position);
                obj.mesh.quaternion.copy(obj.body.quaternion);
            }

            // Logik Penjejakan Kamera (Camera Tracking)
            if (isDragging && draggedMesh) {
                // Kamera mengikuti sedikit di belakang/atas objek
                const offset = new THREE.Vector3(0, 5, 12); 
                targetCameraPos.copy(draggedMesh.position).add(offset);
                targetControlsTarget.copy(draggedMesh.position);

                // Interpolasi pergerakan agar kamera bergerak 'smooth' (lembut)
                camera.position.lerp(targetCameraPos, 0.05);
                controls.target.lerp(targetControlsTarget, 0.1);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Mula selepas memuat
        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
